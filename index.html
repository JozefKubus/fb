<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inšpekcia Odoo XML Feedu pre FB</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        
        .controls-group { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; align-items: center;}
        .url-group { display: flex; width: 100%; max-width: 400px; gap: 8px; }
        .url-group input[type="text"] { flex-grow: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { padding: 8px 16px; cursor: pointer; background-color: #1877f2; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: background-color 0.2s; }
        .btn:hover { background-color: #166fe5; }
        .btn:disabled { background-color: #e4e6eb; color: #bcc0c4; cursor: not-allowed; }
        
        input[type="file"] { display: none; }
        .custom-file-upload { border: 1px solid #ccc; display: inline-block; padding: 8px 16px; cursor: pointer; background-color: #f0f2f5; color: #050505; border-radius: 6px; font-weight: 600; transition: background-color 0.2s;}
        .custom-file-upload:hover { background-color: #e4e6eb; }
        
        .filters { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 10px; width: 100%; }
        select, input[type="text"].search-box { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; width: 100%; max-width: 300px; box-sizing: border-box; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #dc3545; cursor: pointer; background: #fff; padding: 6px 12px; border: 1px solid #f5c2c7; border-radius: 6px; width: 100%; max-width: 300px; box-sizing: border-box; justify-content: center;}
        .checkbox-label input { cursor: pointer; width: 16px; height: 16px;}
        
        .pagination { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; display: none; }
        .page-info { font-weight: 600; color: #050505; font-size: 14px; }
        
        .feed-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;}
        .fb-post { background-color: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 12px; border: 1px solid #e4e6eb; }
        .fb-post-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
        .fb-avatar { width: 40px; height: 40px; background-color: #e4e6eb; border-radius: 50%; border: 1px solid #ced0d4; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #1877f2; font-size: 14px;}
        .fb-author-info { display: flex; flex-direction: column; }
        
        a.fb-author-name, a.fb-domain, a.fb-title { text-decoration: none; }
        a.fb-author-name:hover, a.fb-domain:hover, a.fb-title:hover { text-decoration: underline; }
        
        .fb-author-name { font-weight: 600; color: #050505; font-size: 15px; }
        .fb-sponsored { font-size: 13px; color: #65676b; }
        .fb-post-text { padding: 0 16px 12px; font-size: 15px; color: #050505; line-height: 1.4; }
        .fb-image-container { width: 100%; aspect-ratio: 1/1; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; overflow: hidden; border-top: 1px solid #e4e6eb; border-bottom: 1px solid #e4e6eb; position: relative; }
        .fb-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .fb-product-info { padding: 12px 16px 0 16px; display: flex; justify-content: space-between; align-items: center; cursor: default; }
        .fb-product-details { display: flex; flex-direction: column; max-width: 75%; }
        .fb-domain { font-size: 13px; color: #65676b; text-transform: uppercase; margin-bottom: 2px;}
        .fb-title { font-weight: 600; color: #050505; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fb-price { color: #65676b; font-size: 15px; margin-top: 2px; }
        .fb-cta { background-color: #e4e6eb; color: #050505; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 15px; text-decoration: none; }
        .fb-cta:hover { background-color: #d8dadf; }
        .error-tag { color: #dc3545; font-size: 12px; font-weight: bold; margin-top: 5px; background: #f8d7da; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-right: 5px;}
        .technical-info { padding: 8px 16px; margin: 0 16px 10px 16px; background: #f8f9fa; border-radius: 6px; font-family: monospace; font-size: 12px; color: #495057; border: 1px dashed #ced4da; }
        .stats { font-size: 13px; color: #65676b; margin-top: 10px; font-weight: bold; }
        .error-text { color: #dc3545; }
        
        /* Štýl pre podpis (footer) */
        .footer-signature { text-align: center; font-size: 13px; color: #65676b; margin-top: 30px; padding: 15px 0; border-top: 1px solid #e4e6eb; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin-top:0;">Odoo > Facebook Feed Inšpektor</h2>
        <p style="color: #65676b; font-size: 14px;">Inšpekcia formátu podľa Google/Atom schémy tak, ako ho interpretuje dynamická reklama.</p>
        
        <div class="controls-group">
            <div class="url-group">
                <input type="text" id="feedUrl" placeholder="https://tvoj-odoo-eshop.sk/feed.xml">
                <button class="btn" onclick="loadFeedFromUrl()">Načítať z URL</button>
            </div>
            
            <div style="font-size: 12px; color: #65676b;">alebo</div>
            
            <label class="custom-file-upload">
                <input type="file" id="xmlFileInput" accept=".xml">
                Nahrať súbor lokálne (.xml)
            </label>
            
            <div class="filters" id="filtersGroup" style="display: none;">
                <input type="text" id="searchFilter" class="search-box" placeholder="Hľadať produkt (názov, ID, popis...)">
                
                <select id="categoryFilter">
                    <option value="all">Všetky kategórie</option>
                </select>
                
                <label class="checkbox-label" title="Zobrazí len produkty, ktorým chýbajú dáta alebo majú zlý formát ceny či duplicitné ID">
                    <input type="checkbox" id="errorFilter">
                    Len problémové produkty
                </label>
            </div>
        </div>
        <div id="feedStats" class="stats"></div>
    </div>

    <div id="paginationTop" class="pagination">
        <button class="btn" id="btnPrevTop" onclick="changePage(-1)">Predchádzajúca</button>
        <span class="page-info" id="pageInfoTop">Strana 1 z 1</span>
        <button class="btn" id="btnNextTop" onclick="changePage(1)">Ďalšia</button>
    </div>

    <div id="feedContainer" class="feed-container"></div>

    <div id="paginationBottom" class="pagination">
        <button class="btn" id="btnPrevBottom" onclick="changePage(-1)">Predchádzajúca</button>
        <span class="page-info" id="pageInfoBottom">Strana 1 z 1</span>
        <button class="btn" id="btnNextBottom" onclick="changePage(1)">Ďalšia</button>
    </div>

    <!-- Podpis / Footer stránky -->
    <div class="footer-signature">
        Dodosystems | Verzia 1.0.0 | Posledná úprava: 07.09.2026
    </div>
</div>

<script>
    let allFeedEntries = [];
    let filteredEntries = [];
    let currentPage = 1;
    const itemsPerPage = 100;

    const getTagVal = (entry, tag) => {
        const el = entry.getElementsByTagNameNS("http://base.google.com/ns/1.0", tag)[0] || 
                   entry.getElementsByTagName(tag)[0] || 
                   entry.getElementsByTagName(`g:${tag}`)[0];
        return el ? el.textContent.trim() : '';
    };

    function getEntryErrors(entry) {
        let errors = [];
        const gId = getTagVal(entry, 'id');
        const itemGroupId = getTagVal(entry, 'item_group_id');
        const imageLink = getTagVal(entry, 'image_link');
        const price = getTagVal(entry, 'price');
        const salePrice = getTagVal(entry, 'sale_price') || price;
        const title = getTagVal(entry, 'title');

        if (!gId) errors.push("Chýba ID produktu (g:id)");
        if (!title) errors.push("Chýba názov produktu (title)");
        if (!imageLink) errors.push("Chýba obrázok (g:image_link)");
        if (!salePrice) errors.push("Chýba cena (g:price / g:sale_price)");

        if (salePrice) {
            const priceMatch = salePrice.match(/(\d+\.\d+)/);
            if (priceMatch && priceMatch[1].split('.')[1]?.length > 2) {
                errors.push(`Chyba meny: viac ako 2 desatinné miesta (${salePrice})`);
            }
        }
        if (gId && itemGroupId && gId === itemGroupId) {
            errors.push(`Kolízia: ID a Group ID sú identické (${gId})`);
        }
        return errors;
    }

    document.getElementById('xmlFileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            updateStats("Načítavam a parsujem lokálny súbor...");
            const reader = new FileReader();
            reader.onload = function(e) {
                processXmlText(e.target.result);
            };
            reader.readAsText(file);
        }
    });

    async function loadFeedFromUrl() {
        const url = document.getElementById('feedUrl').value.trim();
        if (!url) {
            updateStats("Zadaj platnú URL adresu.", true);
            return;
        }

        updateStats("Sťahujem XML z URL...");
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const text = await response.text();
            processXmlText(text);
        } catch (error) {
            console.error("Chyba načítavania URL:", error);
            updateStats(`Chyba: Zlyhalo načítanie z URL. Server pravdepodobne blokuje požiadavku (CORS). Skús feed stiahnuť a nahrať manuálne.`, true);
        }
    }

    function processXmlText(xmlText) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        
        const parseError = xmlDoc.getElementsByTagName("parsererror");
        if (parseError.length > 0) {
            updateStats("Chyba: Súbor nie je platné XML.", true);
            return;
        }

        const items = xmlDoc.getElementsByTagName('item');
        const entries = xmlDoc.getElementsByTagName('entry');
        allFeedEntries = items.length > 0 ? Array.from(items) : Array.from(entries);
        
        if (allFeedEntries.length === 0) {
            updateStats("Upozornenie: V XML sa nenašli žiadne tagy <item> ani <entry>.", true);
            return;
        }

        document.getElementById('filtersGroup').style.display = 'flex';
        populateCategoryFilter();
        applyFilter();
    }

    function populateCategoryFilter() {
        const filterSelect = document.getElementById('categoryFilter');
        const categories = new Set();
        
        allFeedEntries.forEach(entry => {
            const cat = getTagVal(entry, 'product_type') || getTagVal(entry, 'google_product_category');
            if (cat) categories.add(cat);
        });

        filterSelect.innerHTML = '<option value="all">Všetky kategórie</option>';
        if (categories.size > 0) {
            Array.from(categories).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat.length > 40 ? cat.substring(0, 37) + '...' : cat;
                filterSelect.appendChild(option);
            });
        }
    }

    document.getElementById('categoryFilter').addEventListener('change', applyFilter);
    document.getElementById('errorFilter').addEventListener('change', applyFilter);
    document.getElementById('searchFilter').addEventListener('input', applyFilter);

    function applyFilter() {
        const selectedCategory = document.getElementById('categoryFilter').value;
        const onlyErrors = document.getElementById('errorFilter').checked;
        const searchQuery = document.getElementById('searchFilter').value.toLowerCase().trim();
        
        filteredEntries = allFeedEntries.filter(entry => {
            const cat = getTagVal(entry, 'product_type') || getTagVal(entry, 'google_product_category');
            const categoryMatch = (selectedCategory === 'all' || cat === selectedCategory);
            
            if (!categoryMatch) return false;

            if (searchQuery) {
                const title = (getTagVal(entry, 'title') || '').toLowerCase();
                const desc = (getTagVal(entry, 'description') || '').toLowerCase();
                const gId = (getTagVal(entry, 'id') || '').toLowerCase();
                
                if (!title.includes(searchQuery) && !desc.includes(searchQuery) && !gId.includes(searchQuery)) {
                    return false;
                }
            }

            if (onlyErrors) {
                const errors = getEntryErrors(entry);
                if (errors.length === 0) return false;
            }

            return true;
        });
        
        currentPage = 1;
        renderPage();
    }

    function changePage(direction) {
        currentPage += direction;
        renderPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateStats(text, isError = false) {
        const statsEl = document.getElementById('feedStats');
        statsEl.innerText = text;
        statsEl.className = isError ? 'stats error-text' : 'stats';
    }

    function renderPage() {
        const container = document.getElementById('feedContainer');
        container.innerHTML = ''; 
        
        const totalItems = filteredEntries.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const pageEntries = filteredEntries.slice(startIndex, endIndex);

        updateStats(`Celkovo vo výbere: ${totalItems} produktov`);
        updatePaginationUI(totalPages);

        pageEntries.forEach(entry => {
            const title = getTagVal(entry, 'title');
            const gId = getTagVal(entry, 'id');
            const itemGroupId = getTagVal(entry, 'item_group_id');
            let description = getTagVal(entry, 'description');
            
            let textDesc = description.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
            if (textDesc.length > 130) textDesc = textDesc.substring(0, 127) + '...';
            
            const imageLink = getTagVal(entry, 'image_link');
            const link = getTagVal(entry, 'link');
            const price = getTagVal(entry, 'price');
            const salePrice = getTagVal(entry, 'sale_price') || price;
            const category = getTagVal(entry, 'product_type') || getTagVal(entry, 'google_product_category');

            const errors = getEntryErrors(entry);
            const domain = link ? new URL(link).hostname.replace('www.', '') : "e-shop.sk";

            const postHtml = `
                <div class="fb-post">
                    <div class="fb-post-header">
                        <div class="fb-avatar">ES</div>
                        <div class="fb-author-info">
                            <a href="${link ? 'https://'+domain : '#'}" target="_blank" class="fb-author-name">${domain}</a>
                            <span class="fb-sponsored">Sponzorované</span>
                        </div>
                    </div>
                    <div class="fb-post-text">${textDesc || title || '<span style="color:red">Chýba text</span>'}</div>
                    
                    <div class="fb-image-container">
                        ${imageLink ? `<a href="${link || '#'}" target="_blank" style="width:100%; height:100%; display:block;"><img src="${imageLink}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/600x600/f0f2f5/65676b?text=Obr%C3%A1zok+nedostupn%C3%BD';"></a>` : `<div style="padding:20px; color:#dc3545; font-weight:bold;">Obrázok chýba v XML</div>`}
                    </div>
                    
                    <div class="fb-product-info">
                        <div class="fb-product-details">
                            <a href="${link ? 'https://'+domain : '#'}" target="_blank" class="fb-domain">${domain}</a>
                            <a href="${link || '#'}" target="_blank" class="fb-title" title="${title}">${title || 'Neznámy produkt'}</a>
                            <span class="fb-price">${salePrice || 'Chýba cena'}</span>
                        </div>
                        <a href="${link || '#'}" target="_blank" class="fb-cta">Kúpiť</a>
                    </div>
                    
                    <div style="padding: 0 16px 12px 16px;">
                        ${errors.length > 0 ? errors.map(err => `<div class="error-tag">⚠️ ${err}</div>`).join('') : ''}
                    </div>
                    
                    <div class="technical-info">
                        g:id = ${gId || '<span style="color:red">Chýba</span>'} | item_group_id = ${itemGroupId || 'N/A'} <br>
                        Kategória: ${category || 'Nezaradené'}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', postHtml);
        });
    }

    function updatePaginationUI(totalPages) {
        const paginations = [
            { id: 'Top', container: 'paginationTop' },
            { id: 'Bottom', container: 'paginationBottom' }
        ];

        paginations.forEach(p => {
            const container = document.getElementById(p.container);
            
            if (filteredEntries.length > 0) {
                container.style.display = 'flex';
                document.getElementById(`pageInfo${p.id}`).innerText = `Strana ${currentPage} z ${totalPages}`;
                
                const btnPrev = document.getElementById(`btnPrev${p.id}`);
                const btnNext = document.getElementById(`btnNext${p.id}`);
                
                btnPrev.disabled = currentPage === 1;
                btnNext.disabled = currentPage === totalPages;
            } else {
                container.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
